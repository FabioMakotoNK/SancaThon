services:
  ciclorota:
    command:
      - uvicorn
      - ciclorota.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --log-level
      - "${CICLOROTA_LOG_LEVEL:-info}"
      - --reload
      - --reload-dir
      - /app/ciclorota
    volumes:
      - ./ciclorota:/app/ciclorota:ro
