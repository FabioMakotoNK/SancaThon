[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciclorota"
version = "0.1.0"
description = "IoT-assisted dynamic industrial waste collection MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "httpx>=0.27,<1.0"]

[project.scripts]
ciclorota-simulate = "ciclorota.simulation:main"

[tool.setuptools.packages.find]
include = ["ciclorota*"]

[tool.setuptools.package-data]
ciclorota = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
